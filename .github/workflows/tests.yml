name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Throwaway Postgres with pgvector, same major version family as Neon.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: boat
          POSTGRES_PASSWORD: boat
          POSTGRES_DB: boat_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U boat"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://boat:boat@localhost:5432/boat_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
